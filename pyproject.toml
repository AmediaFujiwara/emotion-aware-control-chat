[project]
name = "emotion-aware-control-chat"
version = "0.1.0"
description = "不安3軸モデルによる安定性優先チャットAIアプリ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schemas", "services", "components", "utils"]

